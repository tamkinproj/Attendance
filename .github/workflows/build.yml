name: Build APK

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]

# The gate signing key's certificate (public - only its fingerprint, not the
# key). Every APK must be signed with this key to install over the one on the
# gate phones without an uninstall, which would wipe their cards, faces and
# unsent scans. The key itself comes from two repository secrets:
# GATE_KEYSTORE_BASE64 and GATE_KEYSTORE_PASSWORD.
env:
  GATE_CERT_SHA256: fe4d94a06c99ed8aad30b20d2674186688f20322c688ba3e289e6de12c375bb5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ubuntu-latest runners already ship a preinstalled, license-accepted
      # Android SDK under $ANDROID_HOME/$ANDROID_SDK_ROOT - android-actions/
      # setup-android@v3 used to sit here, but it re-detects that preinstalled
      # SDK as "wrong version", downloads an old cmdline-tools zip from
      # dl.google.com, and its `sdkmanager --licenses` call then fails with
      # exit code 1 against the runner's actual (newer) SDK layout. No step
      # is needed here at all - just build against the SDK that's already there.

      - name: Ensure Gradle wrapper jar is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, regenerating with system Gradle"
            gradle wrapper --gradle-version 8.4.0
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up the gate signing key
        env:
          GATE_KEYSTORE_BASE64: ${{ secrets.GATE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GATE_KEYSTORE_BASE64" ]; then
            echo "::warning title=No gate signing key::The GATE_KEYSTORE_BASE64 secret is not set, so these APKs are signed with a throwaway key and will NOT install over the app on the gate phones."
            exit 0
          fi
          # Pasted secrets can pick up line breaks or spaces - drop them.
          printf '%s' "$GATE_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/gate-release.p12"
          echo "GATE_KEYSTORE_FILE=$RUNNER_TEMP/gate-release.p12" >> "$GITHUB_ENV"

      - name: Build with Gradle
        env:
          GATE_KEYSTORE_PASSWORD: ${{ secrets.GATE_KEYSTORE_PASSWORD }}
          GATE_KEY_ALIAS: gate
        run: ./gradlew clean build --stacktrace

      # With the key set up, every APK must carry exactly the gate key - a
      # wrong or replaced key fails here instead of reaching a gate phone.
      - name: Check the APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            sha=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$apk -> $sha"
            if [ "$sha" = "$GATE_CERT_SHA256" ]; then
              echo "### ✅ $(basename "$apk") is signed with the gate key - installs over the app on the gate phones" >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$GATE_KEYSTORE_FILE" ]; then
              echo "::error title=Wrong signing key::$apk is signed with $sha, not the gate key $GATE_CERT_SHA256. Check the GATE_KEYSTORE_BASE64 / GATE_KEYSTORE_PASSWORD secrets."
              exit 1
            else
              echo "### ⚠️ $(basename "$apk") is NOT signed with the gate key - don't install it on a gate phone" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.GATE_KEYSTORE_FILE != '' && 'apk-debug' || 'apk-debug-NOT-FOR-GATE-PHONES' }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # The one to install on the gate phone: not debuggable, so it runs
      # much smoother than the debug APK. Named so a build without the gate
      # key can't be mistaken for it.
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.GATE_KEYSTORE_FILE != '' && 'apk-release-install-this' || 'apk-release-NOT-FOR-GATE-PHONES' }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # See the build job's comment above - no separate SDK setup step is
      # needed, ubuntu-latest already has one preinstalled and configured.

      - name: Ensure Gradle wrapper jar is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, regenerating with system Gradle"
            gradle wrapper --gradle-version 8.4.0
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run linter
        run: ./gradlew lint --stacktrace

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 30
