name: Build APK

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ubuntu-latest runners already ship a preinstalled, license-accepted
      # Android SDK under $ANDROID_HOME/$ANDROID_SDK_ROOT - android-actions/
      # setup-android@v3 used to sit here, but it re-detects that preinstalled
      # SDK as "wrong version", downloads an old cmdline-tools zip from
      # dl.google.com, and its `sdkmanager --licenses` call then fails with
      # exit code 1 against the runner's actual (newer) SDK layout. No step
      # is needed here at all - just build against the SDK that's already there.

      - name: Ensure Gradle wrapper jar is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, regenerating with system Gradle"
            gradle wrapper --gradle-version 8.4.0
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --stacktrace

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # See the build job's comment above - no separate SDK setup step is
      # needed, ubuntu-latest already has one preinstalled and configured.

      - name: Ensure Gradle wrapper jar is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, regenerating with system Gradle"
            gradle wrapper --gradle-version 8.4.0
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run linter
        run: ./gradlew lint --stacktrace

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 30
